<div class="tb-loading" *ngIf="loading; else loaded">
	<ion-spinner name="bubbles"></ion-spinner>
</div>

<ng-template #loaded>
	<div class="tb-trip-details tb-container">
		<ng-container *ngIf="trip.total_budget && trip.total_budget > 0; else noBudget">
			<app-trip-budget-overview [trip]="trip"></app-trip-budget-overview>

			<h2>Categories</h2>
			<app-budget-category-card [tripId]="tripId"></app-budget-category-card>

			<h2>Expenses</h2>
			<app-expenses-list [tripId]="tripId"></app-expenses-list>

			<ion-button id="delete-trip-alert" fill="clear" class="w-100 tb-clear-button">
				Delete Trip</ion-button>

			<ion-alert trigger="delete-trip-alert" header="Delete trip {{ trip.name }}"
				message="This action cannot be undone. Are you sure you want to delete this trip?" 
				[buttons]="alertButtons">
			</ion-alert>

			<ion-fab horizontal="end" vertical="bottom" slot="fixed">
				<ion-fab-button (click)="addExpense()">
					<ion-icon name="receipt"></ion-icon>
				</ion-fab-button>
			</ion-fab>
		</ng-container>

		<ng-template #noBudget>
			<app-empty-state 
				icon="map-outline" 
				title="Your trip is ready!"
				message="Set up your budget to start tracking." 
				(buttonClick)="setupBudget(trip.id)">
			</app-empty-state>
		</ng-template>
	</div>
</ng-template>
