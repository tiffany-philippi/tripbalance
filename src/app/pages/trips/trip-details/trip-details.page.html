<h1>Detalhes da viagem</h1>
<ion-fab horizontal="end" vertical="bottom" slot="fixed">
  <ion-fab-button>
    <ion-icon name="add"></ion-icon>
  </ion-fab-button>
  <ion-fab-list side="top">
    <ion-fab-button>
      <ion-icon name="add"></ion-icon>
      <ion-label>gasto</ion-label>
    </ion-fab-button>
    <ion-fab-button>
      <ion-icon name="add"></ion-icon>
      <ion-label>orçamento</ion-label>
    </ion-fab-button>
  </ion-fab-list>
</ion-fab>
<ion-list>
  <ion-item>
    <ion-label>Budget: {{ (tripDetails.budget || 0) | currency:'BRL' }}</ion-label>
  </ion-item>
  <ion-item>
    <ion-label>Gasto: {{ (tripDetails.total_expenses || 0) | currency:'BRL' }}</ion-label>
  </ion-item>
  <ion-item>
    <ion-label>Saving: {{ (tripDetails.savings || 0) | currency:'BRL' }}</ion-label>
  </ion-item>
</ion-list>
<h2>Expenses</h2>
<ion-list *ngIf="expenses.length > 0; else noExpenses">
  <ion-item *ngFor="let expense of expenses">
    <ion-label>{{ expense.title }}</ion-label>
    <ion-label>{{ expense.amount }}</ion-label>
  </ion-item>
</ion-list>

<ng-template #noExpenses>
  <ion-label>No expenses yet.</ion-label>
</ng-template>
