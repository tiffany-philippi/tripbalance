<div class="tb-container">
	<h1>Viagens</h1>
	<ng-container *ngIf="loading; else loaded">
		<ion-spinner></ion-spinner>
	</ng-container>

	<ng-template #loaded>
		<ion-card *ngFor="let trip of tripsList" (click)="openTrip(trip)">
			<ion-card-header>
				<ion-card-title>{{ trip.name }}</ion-card-title>
				<ion-card-subtitle>{{ trip.start_date }} - {{ trip.end_date }}</ion-card-subtitle>
			</ion-card-header>
			
			<ion-card-content>
				<p>{{ (trip.total_budget | currency:'R$ ') || "Not estimated" }}</p>
			</ion-card-content>
		</ion-card>
	</ng-template>
</div>
