<div class="tb-budget-list">
  <div [formGroup]="form">
    <div *ngFor="let category of selectedCategories" [ngClass]="'tb-budget-item tb-budget-item__' + category.color_key">
      <div class="tb-budget-item__title">
        <ion-icon [name]="category.icon"></ion-icon>
        <span>{{ category.name }}</span>
      </div>
      <ion-input [formControlName]="category.id" type="number" placeholder="0.00" fill="outline"
        class="tb-custom-field">
      </ion-input>
    </div>
  </div>
</div>

<div class="tb-footer">
  <ion-button class="w-100 tb-primary-button" [disabled]="loadingSubmit" (click)="submit()" type="button">
    Create Trip
  </ion-button>
  <ion-button fill="clear" class="w-100 tb-text-danger" (click)="prev.emit()">
    Back
  </ion-button>
</div>
