<div class="tb-checkbox-list" role="group" aria-label="Trip categories">
  @for (category of defaultCategories; track category.id) {
    <div class="tb-category-item" [class.selected]="isSelected(category.id)"
      role="checkbox" tabindex="0" [attr.aria-checked]="isSelected(category.id)" [attr.aria-label]="category.name"
      (click)="toggleCategory(category.id)" (keydown.enter)="toggleCategory(category.id)"
      (keydown.space)="$event.preventDefault(); toggleCategory(category.id)">
      <ion-icon [name]="category.icon" aria-hidden="true"></ion-icon>
      <span>{{ category.name }}</span>
      @if (isSelected(category.id)) {
        <ion-icon name="checkmark-circle" class="check-icon" aria-hidden="true">
        </ion-icon>
      }
    </div>
  }
</div>

<div class="tb-footer">
  <ion-button class="w-100 tb-primary-button" [disabled]="selectedIds.length === 0" (click)="submit()">
    Next
  </ion-button>
  <ion-button fill="clear" class="w-100 tb-text-danger" (click)="prev.emit()">
    Back
  </ion-button>
</div>
