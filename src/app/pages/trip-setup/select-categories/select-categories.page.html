<div class="tb-checkbox-list">
	<div *ngFor="let category of defaultCategories" class="tb-category-item" [class.selected]="isSelected(category.id)"
		(click)="toggleCategory(category.id)">

		<ion-icon [name]="category.icon"></ion-icon>
		<span>{{ category.name }}</span>
		<ion-icon *ngIf="isSelected(category.id)" name="checkmark-circle" class="check-icon">
		</ion-icon>
	</div>
</div>

<div class="tb-footer">
	<ion-button class="w-100 tb-primary-button" [disabled]="selectedIds.length === 0" (click)="submit()">
		Next
	</ion-button>
	<ion-button fill="clear" class="w-100 tb-text-danger" (click)="prev.emit()">
		Back
	</ion-button>
</div>
